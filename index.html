<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安麗 健管45天完整中文版 | 45Days Health Transformation System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0e533c;
            --primary-light: #167a59;
            --primary-dark: #073526;
            --accent: #2ca858;
            --accent-gold: #c99c43;
            --accent-blue: #1c75bc;
            --bg-light: #f7f9f8;
            --surface: #ffffff;
            --text-main: #212529;
            --text-sub: #555e66;
            --border: #e2e8e5;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.05);
            --shadow-md: 0 6px 18px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --sidebar-width: 340px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            height: 100vh;
        }

        /* 側邊導航欄 */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .brand-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.3;
        }

        .brand-sub {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* 頁籤過濾 */
        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: #fafbfb;
        }

        .sidebar-tab {
            flex: 1;
            padding: 12px 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            border: none;
            background: none;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .sidebar-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: #fff;
        }

        /* 頁面清單 */
        .page-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            list-style: none;
        }

        .page-list::-webkit-scrollbar {
            width: 6px;
        }

        .page-list::-webkit-scrollbar-thumb {
            background: #d0d7d4;
            border-radius: 4px;
        }

        .page-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-decoration: none;
            color: inherit;
        }

        .page-item:hover {
            background: #f0f6f3;
            border-color: #d6e8de;
        }

        .page-item.active {
            background: #eaf5ef;
            border-color: #a8dac0;
        }

        .page-badge {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #e4ece8;
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .page-item.active .page-badge {
            background: var(--primary);
            color: #fff;
        }

        .page-info {
            flex: 1;
            min-width: 0;
        }

        .page-item-title {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .page-item-sub {
            font-size: 11.5px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* 主內容區 */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 頂部工具列 */
        .topbar {
            height: 60px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #f0f6f3;
            border-color: var(--accent);
            color: var(--primary);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-counter {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            padding: 0 8px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 切換語言模式開關 */
        .mode-switch-group {
            display: flex;
            background: #ebf0ee;
            border-radius: 20px;
            padding: 3px;
        }

        .mode-btn {
            border: none;
            background: none;
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .action-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #f5f5f5;
        }

        .action-btn.btn-print {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .action-btn.btn-print:hover {
            background: var(--primary-light);
        }

        /* 畫布與內容展現區域 */
        .workspace-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* 單頁簡報容器 */
        .slide-stage {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .slide-card {
            position: relative;
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            width: 100%;
            border: 1px solid #dce4e0;
            transition: transform 0.2s ease;
        }

        .slide-img-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 141.47%; /* 1654 / 2340 = 0.7068 -> 直式 A4 比率 */
            background: #fdfdfd;
        }

        .slide-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 雙圖並排對比模式 */
        .split-view-container {
            display: none;
            width: 100%;
            max-width: 1500px;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .split-col {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid #e0e6e3;
        }

        .split-header {
            padding: 10px 16px;
            font-weight: 700;
            font-size: 13.5px;
            background: #f2f6f4;
            color: var(--primary);
            border-bottom: 1px solid #e0e6e3;
            display: flex;
            justify-content: space-between;
        }

        /* 結構化講稿抽屜卡片 */
        .script-card {
            width: 100%;
            max-width: 880px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            margin-bottom: 40px;
        }

        .script-header {
            padding: 16px 22px;
            background: #fcfdfe;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .script-title-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .script-icon {
            font-size: 20px;
        }

        .script-main-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .script-tag {
            font-size: 11px;
            background: #e6f3ec;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .script-body {
            padding: 22px;
        }

        .script-section {
            margin-bottom: 18px;
        }

        .script-section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .script-text {
            font-size: 14.5px;
            line-height: 1.75;
            color: #333;
            background: #f9fbf9;
            padding: 14px 18px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }

        .product-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .product-chip {
            background: #ebf5f0;
            color: var(--primary);
            border: 1px solid #c2e2d1;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .copy-script-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-script-btn:hover {
            background: #f0f6f3;
            border-color: var(--accent);
            color: var(--primary);
        }

        /* 連續卷軸模式 (Full Book) */
        .book-mode-container {
            display: none;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            gap: 36px;
            padding-bottom: 60px;
        }

        .book-page-wrap {
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .book-page-bar {
            padding: 10px 18px;
            background: #f4f8f6;
            border-bottom: 1px solid var(--border);
            font-size: 13.5px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 列印樣式 @media print */
        @media print {
            body {
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
                display: block !important;
            }
            #sidebar, .topbar, .script-card, .menu-toggle-btn, .mode-switch-group, .action-btn {
                display: none !important;
            }
            #main-content {
                height: auto !important;
                overflow: visible !important;
            }
            .workspace-area {
                padding: 0 !important;
                overflow: visible !important;
                display: block !important;
            }
            .slide-stage {
                display: none !important;
            }
            .book-mode-container {
                display: block !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
            .book-page-wrap {
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                margin: 0 !important;
                width: 100% !important;
            }
            .book-page-bar {
                display: none !important;
            }
            .slide-img-wrapper {
                padding-bottom: 141.47% !important;
            }
        }

        /* 響應式優化 */
        @media (max-width: 992px) {
            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: var(--shadow-lg);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.4);
                z-index: 90;
            }
            .sidebar-overlay.active {
                display: block;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 0 12px;
            }
            .mode-btn span.mode-text {
                display: none;
            }
            .action-btn span.btn-text {
                display: none;
            }
            .workspace-area {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 側邊遮罩 (Mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 側邊導航欄 -->
    <nav id="sidebar">
        <div class="brand-header">
            <span class="brand-badge">Amway Nutrilite</span>
            <div class="brand-title">健管45天 繁體中文手冊</div>
            <div class="brand-sub">45Days Health Transformation System</div>
        </div>

        <div class="sidebar-tabs">
            <button class="sidebar-tab active" onclick="switchFilter('all', this)">全部 (20)</button>
            <button class="sidebar-tab" onclick="switchFilter('階段實踐', this)">實踐指南</button>
            <button class="sidebar-tab" onclick="switchFilter('產品解析', this)">產品解析</button>
        </div>

        <ul class="page-list" id="page-list-el">
            <!-- 頁面列表將由 JS 動態生成 -->
        </ul>
    </nav>

    <!-- 主內容區 -->
    <main id="main-content">
        <!-- 頂部工具列 -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle-btn" onclick="toggleSidebar()">
                    <span>☰</span>
                    <span>目錄</span>
                </button>
            </div>

            <div class="topbar-center">
                <button class="nav-btn" id="prev-btn" onclick="prevPage()">
                    <span>◀</span> 上一頁
                </button>
                <div class="page-counter">
                    <span id="cur-page-num">1</span> / <span>20</span>
                </div>
                <button class="nav-btn" id="next-btn" onclick="nextPage()">
                    下一頁 <span>▶</span>
                </button>
            </div>

            <div class="topbar-right">
                <!-- 語系切換 (繁中版 / 韓文原版) -->
                <div class="mode-switch-group">
                    <button class="mode-btn active" id="btn-zh" onclick="setLanguage('zh')">
                        繁中版
                    </button>
                    <button class="mode-btn" id="btn-ko" onclick="setLanguage('ko')">
                        韓文原版
                    </button>
                    <button class="mode-btn" id="btn-split" onclick="setLanguage('split')">
                        並排對照
                    </button>
                </div>

                <!-- 模式切換：單頁簡報 vs 捲軸手冊 -->
                <button class="action-btn" id="view-mode-btn" onclick="toggleViewMode()">
                    <span id="view-mode-icon">📜</span>
                    <span class="btn-text" id="view-mode-text">連續捲軸</span>
                </button>

                <!-- 列印 / 匯出 PDF -->
                <button class="action-btn btn-print" onclick="window.print()">
                    <span>🖨️</span>
                    <span class="btn-text">列印 / PDF</span>
                </button>
            </div>
        </header>

        <!-- 畫布與內容展現區域 -->
        <div class="workspace-area" id="workspace">

            <!-- 1. 單頁簡報模式 (預設) -->
            <div class="slide-stage" id="slide-stage">
                <!-- 繁中版 / 韓文版主卡片 -->
                <div class="slide-card" id="single-card">
                    <div class="slide-img-wrapper">
                        <img id="main-slide-img" class="slide-img" src="images/page_zh_01.jpg" alt="健管45天 頁面 1" loading="eager">
                    </div>
                </div>

                <!-- 雙圖並排對照卡片 (並排模式啟用時顯示) -->
                <div class="split-view-container" id="split-container">
                    <div class="split-col">
                        <div class="split-header">
                            <span>【繁體中文版】</span>
                            <span id="split-zh-title">P.01 封面</span>
                        </div>
                        <div class="slide-img-wrapper">
                            <img id="split-zh-img" class="slide-img" src="images/page_zh_01.jpg" alt="繁中版">
                        </div>
                    </div>
                    <div class="split-col">
                        <div class="split-header">
                            <span>【韓文原版對照】</span>
                            <span id="split-ko-title">P.01 원본</span>
                        </div>
                        <div class="slide-img-wrapper">
                            <img id="split-ko-img" class="slide-img" src="images/page_ko_01.jpg" alt="韓文版">
                        </div>
                    </div>
                </div>

                <!-- 結構化講稿與重點抽屜 -->
                <div class="script-card">
                    <div class="script-header" onclick="toggleScriptBody()">
                        <div class="script-title-block">
                            <span class="script-icon">💡</span>
                            <div>
                                <div class="script-main-title" id="script-title">P.01 封面：健康管理 45 天方案</div>
                                <span class="script-tag" id="script-category">整體導引</span>
                            </div>
                        </div>
                        <button class="copy-script-btn" onclick="copyCurrentScript(event)">
                            <span>📋</span> 複製本頁講稿
                        </button>
                    </div>

                    <div class="script-body" id="script-body-el">
                        <div class="script-section">
                            <div class="script-section-label">📌 核心觀念摘要</div>
                            <div id="script-summary" style="font-size: 14px; color: #444; margin-bottom: 12px;"></div>
                        </div>

                        <div class="script-section">
                            <div class="script-section-label">🎙️ 講師推薦公版講稿（可直接演講或解說）</div>
                            <div class="script-text" id="script-full-text"></div>
                        </div>

                        <div class="script-section">
                            <div class="script-section-label">🌿 本頁核心關聯產品與營養素</div>
                            <div class="product-chips" id="script-products"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 全本連續捲軸手冊模式 (20 頁直列) -->
            <div class="book-mode-container" id="book-container">
                <!-- 由 JS 生成全部 20 頁 -->
            </div>

        </div>
    </main>

    <script>
        // 資料源

        let currentPage = 1;
        let currentLang = 'zh'; // 'zh' | 'ko' | 'split'
        let currentMode = 'slide'; // 'slide' | 'book'
        let currentFilter = 'all';

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderBookModePages();
            updatePageView();
            setupKeyboardNav();
        });

        // 渲染側邊欄清單
        function renderSidebar() {
            const listEl = document.getElementById('page-list-el');
            listEl.innerHTML = '';

            pagesData.forEach(p => {
                if (currentFilter !== 'all' && p.category !== currentFilter) return;

                const li = document.createElement('li');
                li.className = `page-item ${p.page === currentPage ? 'active' : ''}`;
                li.id = `sidebar-item-${p.page}`;
                li.onclick = () => goToPage(p.page);

                li.innerHTML = `
                    <div class="page-badge">${p.page < 10 ? '0' + p.page : p.page}</div>
                    <div class="page-info">
                        <div class="page-item-title">${p.title}</div>
                        <div class="page-item-sub">${p.subtitle}</div>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        // 頁籤過濾
        function switchFilter(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSidebar();
        }

        // 渲染連續捲軸手冊的所有頁面
        function renderBookModePages() {
            const container = document.getElementById('book-container');
            container.innerHTML = '';

            pagesData.forEach(p => {
                const pad = p.page < 10 ? '0' + p.page : p.page;
                const wrap = document.createElement('div');
                wrap.className = 'book-page-wrap';
                wrap.id = `book-page-${p.page}`;

                wrap.innerHTML = `
                    <div class="book-page-bar">
                        <span>P.${pad} - ${p.title}</span>
                        <span style="font-size: 12px; font-weight: normal; opacity: 0.8;">Amway 45Days System</span>
                    </div>
                    <div class="slide-img-wrapper">
                        <img class="slide-img" src="${imgPrefix}/page_zh_${pad}.jpg" alt="Page ${pad}" loading="lazy">
                    </div>
                `;
                container.appendChild(wrap);
            });
        }

        // 跳轉指定頁數
        function goToPage(page) {
            if (page < 1 || page > 20) return;
            currentPage = page;
            updatePageView();

            // 若在 Mobile，點選後收合 sidebar
            if (window.innerWidth <= 992) {
                toggleSidebar(false);
            }
        }

        function prevPage() {
            if (currentPage > 1) goToPage(currentPage - 1);
        }

        function nextPage() {
            if (currentPage < 20) goToPage(currentPage + 1);
        }

        // 更新當前頁面展現
        function updatePageView() {
            const pad = currentPage < 10 ? '0' + currentPage : currentPage;
            const data = pagesData[currentPage - 1];

            // 1. 更新頁碼計數
            document.getElementById('cur-page-num').innerText = pad;
            document.getElementById('prev-btn').disabled = (currentPage === 1);
            document.getElementById('next-btn').disabled = (currentPage === 20);

            // 2. 更新側邊欄 active 狀態
            document.querySelectorAll('.page-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`sidebar-item-${currentPage}`);
            if (activeEl) {
                activeEl.classList.add('active');
                activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            // 3. 更新主圖片
            const singleCard = document.getElementById('single-card');
            const splitContainer = document.getElementById('split-container');
            const mainImg = document.getElementById('main-slide-img');

            if (currentLang === 'split') {
                singleCard.style.display = 'none';
                splitContainer.style.display = 'grid';
                document.getElementById('split-zh-img').src = `${imgPrefix}/page_zh_${pad}.jpg`;
                document.getElementById('split-ko-img').src = `${imgPrefix}/page_ko_${pad}.jpg`;
                document.getElementById('split-zh-title').innerText = `P.${pad} ${data.title}`;
                document.getElementById('split-ko-title').innerText = `P.${pad} 원본 대조`;
            } else {
                singleCard.style.display = 'block';
                splitContainer.style.display = 'none';
                const prefixLang = (currentLang === 'ko') ? 'ko' : 'zh';
                mainImg.src = `${imgPrefix}/page_${prefixLang}_${pad}.jpg`;
            }

            // 4. 更新講稿資訊
            document.getElementById('script-title').innerText = `P.${pad} ${data.title}`;
            document.getElementById('script-category').innerText = data.category;
            document.getElementById('script-summary').innerText = data.summary;
            document.getElementById('script-full-text').innerText = data.script;

            const prodContainer = document.getElementById('script-products');
            prodContainer.innerHTML = '';
            data.products.forEach(prod => {
                const span = document.createElement('span');
                span.className = 'product-chip';
                span.innerText = prod;
                prodContainer.appendChild(span);
            });

            // 滾動回頂部
            document.getElementById('workspace').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 設置語系模式
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
            document.getElementById('btn-split').classList.toggle('active', lang === 'split');
            updatePageView();
        }

        // 切換單頁簡報 vs 連續捲軸手冊
        function toggleViewMode() {
            const slideStage = document.getElementById('slide-stage');
            const bookContainer = document.getElementById('book-container');
            const icon = document.getElementById('view-mode-icon');
            const text = document.getElementById('view-mode-text');

            if (currentMode === 'slide') {
                currentMode = 'book';
                slideStage.style.display = 'none';
                bookContainer.style.display = 'flex';
                icon.innerText = '🖼️';
                text.innerText = '簡報模式';
            } else {
                currentMode = 'slide';
                slideStage.style.display = 'flex';
                bookContainer.style.display = 'none';
                icon.innerText = '📜';
                text.innerText = '連續捲軸';
            }
        }

        // 複製本頁講稿
        function copyCurrentScript(e) {
            e.stopPropagation();
            const data = pagesData[currentPage - 1];
            const textToCopy = `【健管45天手冊 - P.${currentPage} ${data.title}】\n` +
                               `核心觀念：${data.summary}\n\n` +
                               `公版講稿：\n${data.script}\n\n` +
                               `推薦產品：${data.products.join('、')}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`已成功複製 P.${currentPage} 繁中講稿到剪貼簿！`);
            }).catch(err => {
                console.error(err);
            });
        }

        // 鍵盤導航
        function setupKeyboardNav() {
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    prevPage();
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    nextPage();
                } else if (e.key === 'o' || e.key === 'O') {
                    // O 鍵快速切換中韓
                    setLanguage(currentLang === 'zh' ? 'ko' : 'zh');
                } else if (e.key === 'm' || e.key === 'M') {
                    // M 鍵切換模式
                    toggleViewMode();
                }
            });
        }

        // 收合/展開 Sidebar (Mobile)
        function toggleSidebar(forceState) {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = typeof forceState === 'boolean' ? forceState : !sb.classList.contains('open');

            sb.classList.toggle('open', isOpen);
            overlay.classList.toggle('active', isOpen);
        }

        function toggleScriptBody() {
            const body = document.getElementById('script-body-el');
            body.style.display = (body.style.display === 'none') ? 'block' : 'none';
        }
    </script>
</body>
</html>
